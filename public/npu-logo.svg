<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="50%" stop-color="#5C2A0D" />
      <stop offset="100%" stop-color="#3E1A06" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#5C2A0D" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <path id="textArcThai" d="M 85,572 Q 250,665 415,572" />
    <path id="textArcEng" d="M 105,618 Q 250,705 395,618" />
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Glow & Base -->
  <g filter="url(#shadow)">
    <!-- Outer Teardrop Contour (กรอบนอกทรงซุ้มบัวตูม) -->
    <path 
      d="M250 55 C295 125 435 275 435 435 C435 520 355 580 250 580 C145 580 65 520 65 435 C65 275 205 125 250 55 Z" 
      fill="#FFFFFF" 
      stroke="#5C2A0D" 
      stroke-width="5" 
      stroke-linejoin="round"
    />

    <!-- Inner Border Line 1 -->
    <path 
      d="M250 72 C290 135 420 280 420 432 C420 508 348 565 250 565 C152 565 80 508 80 432 C80 280 210 135 250 72 Z" 
      fill="none" 
      stroke="#D84315" 
      stroke-width="2.5" 
    />

    <!-- Inner Border Line 2 (Very fine hairline) -->
    <path 
      d="M250 82 C286 142 410 285 410 430 C410 500 342 555 250 555 C158 555 90 500 90 430 C90 285 214 142 250 82 Z" 
      fill="none" 
      stroke="#EA580C" 
      stroke-width="1" 
      opacity="0.6"
    />
  </g>

  <!-- Golden Rice Sheaves (รวงข้าวสีทองซ้าย-ขวา) -->
  <g fill="url(#goldGrad)" stroke="#B45309" stroke-width="0.7">
    <!-- Left Rice Grains - Outer Column -->
    <path d="M155 220 C136 208 118 232 142 245 C155 251 161 232 155 220 Z" />
    <path d="M136 265 C118 252 100 276 124 289 C136 295 142 276 136 265 Z" />
    <path d="M122 315 C102 302 88 330 112 342 C124 347 130 327 122 315 Z" />
    <path d="M110 370 C90 358 78 385 102 397 C114 402 118 382 110 370 Z" />
    <path d="M102 425 C82 416 72 443 97 453 C109 458 112 437 102 425 Z" />
    <path d="M102 480 C84 474 76 502 99 507 C111 511 112 490 102 480 Z" />
    
    <!-- Left Rice Grains - Inner Column -->
    <path d="M176 195 C161 176 139 197 161 213 C173 222 183 207 176 195 Z" />
    <path d="M164 245 C149 226 127 247 149 263 C161 272 171 257 164 245 Z" />
    <path d="M151 298 C136 280 114 301 136 317 C148 326 158 310 151 298 Z" />
    <path d="M139 355 C124 339 102 360 124 376 C136 385 146 368 139 355 Z" />
    <path d="M130 412 C118 396 96 418 118 433 C130 440 139 424 130 412 Z" />
    <path d="M125 468 C113 452 93 474 114 488 C126 495 133 479 125 468 Z" />

    <!-- Right Rice Grains - Outer Column -->
    <path d="M345 220 C364 208 382 232 358 245 C345 251 339 232 345 220 Z" />
    <path d="M364 265 C382 252 400 276 376 289 C364 295 358 276 364 265 Z" />
    <path d="M378 315 C398 302 412 330 388 342 C376 347 370 327 378 315 Z" />
    <path d="M390 370 C410 358 422 385 398 397 C386 402 382 382 390 370 Z" />
    <path d="M398 425 C418 416 428 443 403 453 C391 458 388 437 398 425 Z" />
    <path d="M398 480 C416 474 424 502 401 507 C389 511 388 490 398 480 Z" />

    <!-- Right Rice Grains - Inner Column -->
    <path d="M324 195 C339 176 361 197 339 213 C327 222 317 207 324 195 Z" />
    <path d="M336 245 C351 226 373 247 351 263 C339 272 329 257 336 245 Z" />
    <path d="M349 298 C364 280 386 301 364 317 C352 326 342 310 349 298 Z" />
    <path d="M361 355 C376 339 398 360 376 376 C364 385 354 368 361 355 Z" />
    <path d="M370 412 C382 396 404 418 382 433 C370 440 361 424 370 412 Z" />
    <path d="M375 468 C387 452 407 474 386 488 C374 495 367 479 375 468 Z" />
  </g>

  <!-- Central Arched Petal Lines (กลีบบัวซุ้มเรือนแก้วโอบรอบพระธาตุ) -->
  <g stroke="#C2410C" stroke-width="2.5" fill="none">
    <!-- Inner Arch Flanking Stupa -->
    <path d="M195 440 C190 315 220 230 250 175 C280 230 310 315 305 440" />
    <!-- Outer Arch Left -->
    <path d="M142 440 C138 340 188 260 218 220" />
    <!-- Outer Arch Right -->
    <path d="M358 440 C362 340 312 260 282 220" />
  </g>

  <!-- Sacred Spire Apex of Phra That Phanom (ยอดพระธาตุพนม) -->
  <g>
    <!-- Sacred Flame Jewel (หยดเปลวไฟปลายยอด) -->
    <path d="M250 68 C256 82 260 96 250 110 C240 96 244 82 250 68 Z" fill="url(#flameGrad)" />
    <!-- Tiered Spire Rings -->
    <path d="M246 116 L254 116 L253 148 L247 148 Z" fill="#D84315" />
    <circle cx="250" cy="116" r="4.5" fill="#D84315" />
    <circle cx="250" cy="128" r="6" fill="#D84315" />
    <circle cx="250" cy="142" r="7.5" fill="#D84315" />
    <path d="M240 148 L260 148 L262 160 L238 160 Z" fill="#D84315" />
    <path d="M236 160 L264 160 L266 172 L234 172 Z" fill="#D84315" />
  </g>

  <!-- Central Pagoda Body (องค์พระธาตุพนมสีขาวขอบส้ม) -->
  <path 
    d="M236 172 L264 172 L280 435 L220 435 Z" 
    fill="#FFFFFF" 
    stroke="#C2410C" 
    stroke-width="3.5" 
    stroke-linejoin="round"
  />

  <!-- Traditional Floral Tree Carvings inside Pagoda (ลวดลายต้นไม้พระธาตุพนม) -->
  <g fill="url(#flameGrad)" stroke="#C2410C" stroke-width="0.8">
    <!-- Center Stalk -->
    <path d="M248 200 L252 200 L251 405 L249 405 Z" />
    <!-- Apex Leaf/Bud -->
    <path d="M250 195 C258 212 250 228 250 232 C250 228 242 212 250 195 Z" />
    <!-- Tier 1 Flowers -->
    <path d="M249 245 C234 233 227 252 245 258 C249 259 249 250 249 245 Z" />
    <path d="M251 245 C266 233 273 252 255 258 C251 259 251 250 251 245 Z" />
    <!-- Tier 2 Flowers -->
    <path d="M249 285 C226 268 216 298 241 302 C249 303 249 290 249 285 Z" />
    <path d="M251 285 C274 268 284 298 259 302 C251 303 251 290 251 285 Z" />
    <!-- Tier 3 Lower Floral Branches -->
    <path d="M249 328 C216 308 206 345 238 348 C249 349 249 334 249 328 Z" />
    <path d="M251 328 C284 308 294 345 262 348 C251 349 251 334 251 328 Z" />
    <!-- Base Floral Sprout -->
    <path d="M249 375 C222 360 215 392 242 395 C249 396 249 382 249 375 Z" />
    <path d="M251 375 C278 360 285 392 258 395 C251 396 251 382 251 375 Z" />
  </g>

  <!-- Blooming Lotus Pedestal Base (ฐานบัวบาน 3 กลีบรองรับองค์พระธาตุ) -->
  <g fill="url(#lotusGrad)" stroke="#4A1E07" stroke-width="2.5" stroke-linejoin="round">
    <!-- Center Upright Petal -->
    <path d="M250 405 C270 422 284 458 276 482 C250 475 250 475 224 482 C216 458 230 422 250 405 Z" />
    <!-- Left Blooming Petal -->
    <path d="M222 448 C198 448 178 474 186 495 C208 495 226 484 230 468 Z" />
    <!-- Right Blooming Petal -->
    <path d="M278 448 C302 448 322 474 314 495 C292 495 274 484 270 468 Z" />
  </g>

  <!-- Mekong River Waves (สายน้ำแม่น้ำโขง 3 ระลอกคลื่นสีฟ้าสดใส) -->
  <g stroke="url(#waterGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <!-- Wave Line 1 -->
    <path d="M155 515 C178 506 200 524 225 515 C250 506 275 524 300 515 C320 508 335 515 345 515" />
    <!-- Wave Line 2 -->
    <path d="M142 530 C170 520 200 540 230 530 C260 520 290 540 320 530 C338 525 348 530 358 530" />
    <!-- Wave Line 3 -->
    <path d="M160 545 C185 536 212 554 240 545 C268 536 295 554 322 545 C335 540 342 545 345 545" />
  </g>

  <!-- Banner Ribbon Wings - Traditional Thai Kanok Scrolls (แถบโบว์กนกสีน้ำตาลทอง) -->
  <g fill="url(#bronzeGrad)" stroke="#3E1A06" stroke-width="2.5" stroke-linejoin="round">
    <!-- Left Kanok Scroll Flame -->
    <path d="M72 475 C58 510 76 545 106 550 C114 515 96 495 72 475 Z" />
    <path d="M84 455 C64 475 60 510 78 522 C72 500 80 482 96 470 Z" />
    <!-- Right Kanok Scroll Flame -->
    <path d="M428 475 C442 510 424 545 394 550 C386 515 404 495 428 475 Z" />
    <path d="M416 455 C436 475 440 510 422 522 C428 500 420 482 404 470 Z" />
  </g>

  <!-- Main Banner Ribbon Body (แถบโบว์สีขาวขอบน้ำตาลเข้ม) -->
  <g>
    <!-- Ribbon Shadow/Underlayer -->
    <path 
      d="M86 550 Q250 655 414 550 L402 625 Q250 725 98 625 Z" 
      fill="#FFFFFF" 
      stroke="#5C2A0D" 
      stroke-width="4.5" 
      stroke-linejoin="round"
    />
    <!-- Center V-Notch at bottom ribbon fold -->
    <path 
      d="M98 625 L84 650 L120 642 Z" 
      fill="url(#bronzeGrad)" 
      stroke="#5C2A0D" 
      stroke-width="2" 
    />
    <path 
      d="M402 625 L416 650 L380 642 Z" 
      fill="url(#bronzeGrad)" 
      stroke="#5C2A0D" 
      stroke-width="2" 
    />
  </g>

  <!-- Thai Typography: "มหาวิทยาลัยนครพนม" -->
  <text 
    fill="#3E1A06" 
    font-size="31" 
    font-weight="900" 
    font-family="'Prompt', 'Sarabun', 'Noto Sans Thai', sans-serif" 
    letter-spacing="0.06em"
  >
    <textPath href="#textArcThai" startOffset="50%" text-anchor="middle">
      มหาวิทยาลัยนครพนม
    </textPath>
  </text>

  <!-- English Typography: "NAKHON PHANOM UNIVERSITY" -->
  <text 
    fill="#5C2A0D" 
    font-size="18" 
    font-weight="800" 
    font-family="'Prompt', 'Arial', 'Helvetica', sans-serif" 
    letter-spacing="0.13em"
  >
    <textPath href="#textArcEng" startOffset="50%" text-anchor="middle">
      NAKHON PHANOM UNIVERSITY
    </textPath>
  </text>
</svg>
